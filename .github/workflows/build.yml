name: Build Noor Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Noor-GitHub-Pages-Ready-43.zip-1.part-*"
      - "Noor-GitHub-Pages-Ready-42.zip-1.part-*"
      - "Noor-GitHub-Pages-Ready-41.zip-1.part-*"
      - "Noor-GitHub-Pages-Ready-40.zip-1.part-*"
      - "Noor-GitHub-Pages-Ready-38.zip-1.part-*"
      - "Noor-GitHub-Pages-Ready-37.zip-1.part-*"
      - "Noor-GitHub-Pages-Ready-36.zip-1.part-*"
      - "Noor-GitHub-Pages-Ready-35.zip-1.part-*"
      - "Noor-GitHub-Pages-Ready-33.zip-1.part-*"
      - "Noor-GitHub-Pages-Ready-30.zip-1.part-*"
      - "Noor-GitHub-Pages-Ready-29.zip-1.part-*"
      - "Noor-GitHub-Pages-Ready-28.zip-1.part-*"
      - "Noor-GitHub-Pages-Ready-27.zip-1.part-*"
      - "Noor-GitHub-Pages-Ready-26.zip-1.part-*"
      - "Noor-GitHub-Pages-Ready-25.zip-1.part-*"
      - "Noor-GitHub-Pages-Ready-25.zip.part-*"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: noor-android-build
  cancel-in-progress: true

jobs:
  apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize Release 44 archive filenames
        shell: bash
        run: |
          renamed=false
          for suffix in 00 01; do
            temporary="Noor-GitHub-Pages-Ready-44.zip-1.part-${suffix}.zip"
            official="Noor-GitHub-Pages-Ready-44.zip-1.part-${suffix}"
            if [[ -f "${temporary}" && ! -f "${official}" ]]; then
              mv "${temporary}" "${official}"
              renamed=true
            fi
          done
          if [[ "${renamed}" == true ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Noor-GitHub-Pages-Ready-44.zip-1.part-*
            git commit -m "Normalize Noor Release 44 archive filenames"
            git push
          fi
      - name: Extract Noor project
        shell: bash
        run: |
          rm -rf noor
          mkdir noor
          ARCHIVE="Noor-GitHub-Pages-Ready.zip"
          # Prefer the newest release while retaining previous archives as fallback.
          if [[ -f Noor-GitHub-Pages-Ready-43.zip-1.part-00 || -f Noor-GitHub-Pages-Ready-43.zip-1.part-01 ]]; then
            if [[ ! -f Noor-GitHub-Pages-Ready-43.zip-1.part-00 || ! -f Noor-GitHub-Pages-Ready-43.zip-1.part-01 ]]; then
              echo 'Upload both parts of release 43 before running this workflow.' >&2
              exit 1
            fi
            BASE=Noor-GitHub-Pages-Ready-43.zip-1
          elif [[ -f Noor-GitHub-Pages-Ready-42.zip-1.part-00 || -f Noor-GitHub-Pages-Ready-42.zip-1.part-01 ]]; then
            if [[ ! -f Noor-GitHub-Pages-Ready-42.zip-1.part-00 || ! -f Noor-GitHub-Pages-Ready-42.zip-1.part-01 ]]; then
              echo 'Upload both parts of release 42 before running this workflow.' >&2
              exit 1
            fi
          fi
          if [[ -f Noor-GitHub-Pages-Ready-41.zip-1.part-00 || -f Noor-GitHub-Pages-Ready-41.zip-1.part-01 ]]; then
            if [[ ! -f Noor-GitHub-Pages-Ready-41.zip-1.part-00 || ! -f Noor-GitHub-Pages-Ready-41.zip-1.part-01 ]]; then
              echo 'Upload both parts of release 40 before running this workflow.' >&2
              exit 1
            fi
          fi
          if [[ -f Noor-GitHub-Pages-Ready-40.zip-1.part-00 || -f Noor-GitHub-Pages-Ready-40.zip-1.part-01 ]]; then
            if [[ ! -f Noor-GitHub-Pages-Ready-40.zip-1.part-00 || ! -f Noor-GitHub-Pages-Ready-40.zip-1.part-01 ]]; then
              echo 'Upload both parts of release 39 before running this workflow.' >&2
              exit 1
            fi
          fi
          if [[ -f Noor-GitHub-Pages-Ready-38.zip-1.part-00 || -f Noor-GitHub-Pages-Ready-38.zip-1.part-01 ]]; then
            if [[ ! -f Noor-GitHub-Pages-Ready-38.zip-1.part-00 || ! -f Noor-GitHub-Pages-Ready-38.zip-1.part-01 ]]; then
              echo 'Upload both parts of release 38 before running this workflow.' >&2
              exit 1
            fi
          fi
          if [[ -f Noor-GitHub-Pages-Ready-37.zip-1.part-00 || -f Noor-GitHub-Pages-Ready-37.zip-1.part-01 ]]; then
            if [[ ! -f Noor-GitHub-Pages-Ready-37.zip-1.part-00 || ! -f Noor-GitHub-Pages-Ready-37.zip-1.part-01 ]]; then
              echo 'Upload both parts of release 37 before running this workflow.' >&2
              exit 1
            fi
          fi
          if [[ -f Noor-GitHub-Pages-Ready-36.zip-1.part-00 || -f Noor-GitHub-Pages-Ready-36.zip-1.part-01 ]]; then
            if [[ ! -f Noor-GitHub-Pages-Ready-36.zip-1.part-00 || ! -f Noor-GitHub-Pages-Ready-36.zip-1.part-01 ]]; then
              echo 'Upload both parts of release 36 before running this workflow.' >&2
              exit 1
            fi
          fi
          if [[ -f Noor-GitHub-Pages-Ready-35.zip-1.part-00 || -f Noor-GitHub-Pages-Ready-35.zip-1.part-01 ]]; then
            if [[ ! -f Noor-GitHub-Pages-Ready-35.zip-1.part-00 || ! -f Noor-GitHub-Pages-Ready-35.zip-1.part-01 ]]; then
              echo 'Upload both parts of release 35 before running this workflow.' >&2
              exit 1
            fi
          fi
          if [[ -f Noor-GitHub-Pages-Ready-33.zip-1.part-00 || -f Noor-GitHub-Pages-Ready-33.zip-1.part-01 ]]; then
            if [[ ! -f Noor-GitHub-Pages-Ready-33.zip-1.part-00 || ! -f Noor-GitHub-Pages-Ready-33.zip-1.part-01 ]]; then
              echo 'Upload both parts of release 33 before running this workflow.' >&2
              exit 1
            fi
          fi
          if [[ -f Noor-GitHub-Pages-Ready-30.zip-1.part-00 || -f Noor-GitHub-Pages-Ready-30.zip-1.part-01 ]]; then
            if [[ ! -f Noor-GitHub-Pages-Ready-30.zip-1.part-00 || ! -f Noor-GitHub-Pages-Ready-30.zip-1.part-01 ]]; then
              echo 'Upload both parts of release 30 before running this workflow.' >&2
              exit 1
            fi
          fi
          if [[ -f Noor-GitHub-Pages-Ready-29.zip-1.part-00 || -f Noor-GitHub-Pages-Ready-29.zip-1.part-01 ]]; then
            if [[ ! -f Noor-GitHub-Pages-Ready-29.zip-1.part-00 || ! -f Noor-GitHub-Pages-Ready-29.zip-1.part-01 ]]; then
              echo 'Upload both parts of release 29 before running this workflow.' >&2
              exit 1
            fi
          fi
          if [[ -f Noor-GitHub-Pages-Ready-28.zip-1.part-00 || -f Noor-GitHub-Pages-Ready-28.zip-1.part-01 ]]; then
            if [[ ! -f Noor-GitHub-Pages-Ready-28.zip-1.part-00 || ! -f Noor-GitHub-Pages-Ready-28.zip-1.part-01 ]]; then
              echo 'Upload both parts of release 28 before running this workflow.' >&2
              exit 1
            fi
          fi
          if [[ -f Noor-GitHub-Pages-Ready-27.zip-1.part-00 || -f Noor-GitHub-Pages-Ready-27.zip-1.part-01 ]]; then
            if [[ ! -f Noor-GitHub-Pages-Ready-27.zip-1.part-00 || ! -f Noor-GitHub-Pages-Ready-27.zip-1.part-01 ]]; then
              echo 'Upload both parts of release 27 before running this workflow.' >&2
              exit 1
            fi
          fi
          if [[ -f Noor-GitHub-Pages-Ready-26.zip-1.part-00 || -f Noor-GitHub-Pages-Ready-26.zip-1.part-01 ]]; then
            if [[ ! -f Noor-GitHub-Pages-Ready-26.zip-1.part-00 || ! -f Noor-GitHub-Pages-Ready-26.zip-1.part-01 ]]; then
              echo 'Upload both parts of release 26 before running this workflow.' >&2
              exit 1
            fi
          fi
          if [[ -f Noor-GitHub-Pages-Ready-25.zip-1.part-00 || -f Noor-GitHub-Pages-Ready-25.zip-1.part-01 ]]; then
            if [[ ! -f Noor-GitHub-Pages-Ready-25.zip-1.part-00 || ! -f Noor-GitHub-Pages-Ready-25.zip-1.part-01 ]]; then
              echo 'Upload both parts of the new release before running this workflow.' >&2
              exit 1
            fi
          fi
          for BASE in Noor-GitHub-Pages-Ready-42.zip-1 Noor-GitHub-Pages-Ready-41.zip-1 Noor-GitHub-Pages-Ready-40.zip-1 Noor-GitHub-Pages-Ready-38.zip-1 Noor-GitHub-Pages-Ready-37.zip-1 Noor-GitHub-Pages-Ready-36.zip-1 Noor-GitHub-Pages-Ready-35.zip-1 Noor-GitHub-Pages-Ready-33.zip-1 Noor-GitHub-Pages-Ready-30.zip-1 Noor-GitHub-Pages-Ready-29.zip-1 Noor-GitHub-Pages-Ready-28.zip-1 Noor-GitHub-Pages-Ready-27.zip-1 Noor-GitHub-Pages-Ready-26.zip-1 Noor-GitHub-Pages-Ready-25.zip-1 Noor-GitHub-Pages-Ready-25.zip; do
            if [[ -f "${BASE}.part-00" && -f "${BASE}.part-01" ]]; then
              echo "Extracting ${BASE}.part-00 and ${BASE}.part-01"
              cat "${BASE}.part-00" "${BASE}.part-01" > "$ARCHIVE"
              break
            fi
          done
          if [[ ! -s "$ARCHIVE" ]]; then
            echo 'Missing matching .part-00 and .part-01 files at the repository root.' >&2
            ls -lh *.part-* 2>/dev/null || true
            exit 1
          fi
          unzip -tq "$ARCHIVE"
          unzip -q "$ARCHIVE" -d noor

      - name: Download and validate Quran sources
        working-directory: noor
        shell: bash
        run: |
          chmod +x scripts/fetch-data.sh
          ./scripts/fetch-data.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch licensed optional Quran font and iqama sound
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p noor/public/fonts noor/android/app/src/main/res/raw
          curl --fail --location --retry 4 --retry-delay 2 \
            https://raw.githubusercontent.com/Youssif-Salama/amiri-font/master/AmiriQuran.ttf \
            -o noor/public/fonts/AmiriQuran.ttf
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Allahuakbar.opus' \
            -o noor/android/app/src/main/res/raw/iqama_takbir.opus
          test -s noor/public/fonts/AmiriQuran.ttf
          test -s noor/android/app/src/main/res/raw/iqama_takbir.opus

      - name: Install web dependencies
        working-directory: noor
        run: npm ci --no-audit --no-fund

      - name: Run web integration tests
        working-directory: noor
        run: |
          npm run qa:quran
          npm run qa:release42
          npm test

      - name: Build web app
        working-directory: noor
        run: npm run build

      - name: Copy built web app into Android assets
        shell: bash
        run: |
          rm -rf noor/android/app/src/main/assets/www
          mkdir -p noor/android/app/src/main/assets/www
          cp -a noor/dist/. noor/android/app/src/main/assets/www/
          test -f noor/android/app/src/main/assets/www/index.html
          test -f noor/android/app/src/main/assets/www/data/quran.json
          test -f noor/android/app/src/main/assets/www/data/word_root_index.json
          test -f noor/android/app/src/main/assets/www/data/common_facts.json
          python3 - <<'PY'
          import json
          p="noor/android/app/src/main/assets/www/data/quran.json"
          d=json.load(open(p,encoding="utf-8"))
          assert len(d["surahs"]) == 114
          assert sum(len(s["ayahs"]) for s in d["surahs"]) == 6236
          print("✓ Quran JSON is physically bundled inside the APK assets")
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Enable AndroidX
        shell: bash
        run: |
          touch noor/android/gradle.properties
          echo 'android.useAndroidX=true' >> noor/android/gradle.properties
          echo 'android.enableJetifier=true' >> noor/android/gradle.properties
          grep -Fx 'android.useAndroidX=true' noor/android/gradle.properties

      - name: Build debug APK
        working-directory: noor/android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Build unsigned release AAB
        working-directory: noor/android
        run: gradle :app:bundleRelease --stacktrace --no-daemon

      - name: Prepare install package
        shell: bash
        run: |
          mkdir -p output
          cp noor/android/app/build/outputs/apk/debug/app-debug.apk output/Noor-debug.apk
          sha256sum output/Noor-debug.apk > output/Noor-debug.apk.sha256
          cp noor/android/app/build/outputs/bundle/release/app-release.aab output/Noor-release-unsigned.aab
          sha256sum output/Noor-release-unsigned.aab > output/Noor-release-unsigned.aab.sha256
          ls -lh output/

      - name: Upload Noor APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-APK
          path: |
            output/Noor-debug.apk
            output/Noor-debug.apk.sha256
            output/Noor-release-unsigned.aab
            output/Noor-release-unsigned.aab.sha256
          if-no-files-found: error
          retention-days: 30

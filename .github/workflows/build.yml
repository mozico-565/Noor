name: Build Noor Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Noor-GitHub-Pages-Ready.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: noor-android-build
  cancel-in-progress: true

jobs:
  apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Noor project
        shell: bash
        run: |
          rm -rf noor
          mkdir noor
          unzip -q Noor-GitHub-Pages-Ready.zip -d noor

      - name: Download and validate Quran sources
        working-directory: noor
        shell: bash
        run: |
          chmod +x scripts/fetch-data.sh
          ./scripts/fetch-data.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies
        working-directory: noor
        run: npm install --no-audit --no-fund

      - name: Build web app
        working-directory: noor
        run: npm run build

      - name: Copy built web app into Android assets
        shell: bash
        run: |
          rm -rf noor/android/app/src/main/assets/www
          mkdir -p noor/android/app/src/main/assets/www
          cp -a noor/dist/. noor/android/app/src/main/assets/www/
          test -f noor/android/app/src/main/assets/www/index.html
          test -f noor/android/app/src/main/assets/www/data/quran.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: noor/android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare install package
        shell: bash
        run: |
          mkdir -p output
          cp noor/android/app/build/outputs/apk/debug/app-debug.apk output/Noor-debug.apk
          sha256sum output/Noor-debug.apk > output/Noor-debug.apk.sha256
          ls -lh output/

      - name: Upload Noor APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-APK
          path: |
            output/Noor-debug.apk
            output/Noor-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

name: Build Noor Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Noor-GitHub-Pages-Ready-29.zip-1.part-*"
      - "Noor-GitHub-Pages-Ready-28.zip-1.part-*"
      - "Noor-GitHub-Pages-Ready-27.zip-1.part-*"
      - "Noor-GitHub-Pages-Ready-26.zip-1.part-*"
      - "Noor-GitHub-Pages-Ready-25.zip-1.part-*"
      - "Noor-GitHub-Pages-Ready-25.zip.part-*"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: noor-android-build
  cancel-in-progress: true

jobs:
  apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Noor project
        shell: bash
        run: |
          rm -rf noor
          mkdir noor
          ARCHIVE="Noor-GitHub-Pages-Ready.zip"
          # Prefer the newest release while retaining the previous archive as fallback.
          if [[ -f Noor-GitHub-Pages-Ready-29.zip-1.part-00 || -f Noor-GitHub-Pages-Ready-29.zip-1.part-01 ]]; then
            if [[ ! -f Noor-GitHub-Pages-Ready-29.zip-1.part-00 || ! -f Noor-GitHub-Pages-Ready-29.zip-1.part-01 ]]; then
              echo 'Upload both parts of release 29 before running this workflow.' >&2
              exit 1
            fi
          fi
          if [[ -f Noor-GitHub-Pages-Ready-28.zip-1.part-00 || -f Noor-GitHub-Pages-Ready-28.zip-1.part-01 ]]; then
            if [[ ! -f Noor-GitHub-Pages-Ready-28.zip-1.part-00 || ! -f Noor-GitHub-Pages-Ready-28.zip-1.part-01 ]]; then
              echo 'Upload both parts of release 28 before running this workflow.' >&2
              exit 1
            fi
          fi
          if [[ -f Noor-GitHub-Pages-Ready-27.zip-1.part-00 || -f Noor-GitHub-Pages-Ready-27.zip-1.part-01 ]]; then
            if [[ ! -f Noor-GitHub-Pages-Ready-27.zip-1.part-00 || ! -f Noor-GitHub-Pages-Ready-27.zip-1.part-01 ]]; then
              echo 'Upload both parts of release 27 before running this workflow.' >&2
              exit 1
            fi
          fi
          if [[ -f Noor-GitHub-Pages-Ready-26.zip-1.part-00 || -f Noor-GitHub-Pages-Ready-26.zip-1.part-01 ]]; then
            if [[ ! -f Noor-GitHub-Pages-Ready-26.zip-1.part-00 || ! -f Noor-GitHub-Pages-Ready-26.zip-1.part-01 ]]; then
              echo 'Upload both parts of release 26 before running this workflow.' >&2
              exit 1
            fi
          fi
          if [[ -f Noor-GitHub-Pages-Ready-25.zip-1.part-00 || -f Noor-GitHub-Pages-Ready-25.zip-1.part-01 ]]; then
            if [[ ! -f Noor-GitHub-Pages-Ready-25.zip-1.part-00 || ! -f Noor-GitHub-Pages-Ready-25.zip-1.part-01 ]]; then
              echo 'Upload both parts of the new release before running this workflow.' >&2
              exit 1
            fi
          fi
          for BASE in Noor-GitHub-Pages-Ready-29.zip-1 Noor-GitHub-Pages-Ready-28.zip-1 Noor-GitHub-Pages-Ready-27.zip-1 Noor-GitHub-Pages-Ready-26.zip-1 Noor-GitHub-Pages-Ready-25.zip-1 Noor-GitHub-Pages-Ready-25.zip; do
            if [[ -f "${BASE}.part-00" && -f "${BASE}.part-01" ]]; then
              echo "Extracting ${BASE}.part-00 and ${BASE}.part-01"
              cat "${BASE}.part-00" "${BASE}.part-01" > "$ARCHIVE"
              break
            fi
          done
          if [[ ! -s "$ARCHIVE" ]]; then
            echo 'Missing matching .part-00 and .part-01 files at the repository root.' >&2
            ls -lh *.part-* 2>/dev/null || true
            exit 1
          fi
          unzip -tq "$ARCHIVE"
          unzip -q "$ARCHIVE" -d noor

      - name: Download and validate Quran sources
        working-directory: noor
        shell: bash
        run: |
          chmod +x scripts/fetch-data.sh
          ./scripts/fetch-data.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies
        working-directory: noor
        run: npm ci --no-audit --no-fund

      - name: Run web integration tests
        working-directory: noor
        run: |
          npm run qa:quran
          npm test

      - name: Build web app
        working-directory: noor
        run: npm run build

      - name: Copy built web app into Android assets
        shell: bash
        run: |
          rm -rf noor/android/app/src/main/assets/www
          mkdir -p noor/android/app/src/main/assets/www
          cp -a noor/dist/. noor/android/app/src/main/assets/www/
          test -f noor/android/app/src/main/assets/www/index.html
          test -f noor/android/app/src/main/assets/www/data/quran.json
          test -f noor/android/app/src/main/assets/www/data/word_root_index.json
          test -f noor/android/app/src/main/assets/www/data/common_facts.json
          python3 - <<'PY'
          import json
          p="noor/android/app/src/main/assets/www/data/quran.json"
          d=json.load(open(p,encoding="utf-8"))
          assert len(d["surahs"]) == 114
          assert sum(len(s["ayahs"]) for s in d["surahs"]) == 6236
          print("✓ Quran JSON is physically bundled inside the APK assets")
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platforms;android-35"             "build-tools;35.0.0"             "ndk;29.0.13113456"             "cmake;3.31.6"

      - name: Fetch llama.cpp native runtime
        shell: bash
        run: |
          test ! -e noor/android/app/src/main/cpp/llama.cpp
          git init noor/android/app/src/main/cpp/llama.cpp
          git -C noor/android/app/src/main/cpp/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C noor/android/app/src/main/cpp/llama.cpp fetch --depth 1 origin fb34fc262c1b43f1832c7472429fb2247d650493
          git -C noor/android/app/src/main/cpp/llama.cpp checkout --detach FETCH_HEAD
          test -f noor/android/app/src/main/cpp/llama.cpp/include/llama.h

      - name: Fetch whisper.cpp native runtime
        shell: bash
        run: |
          test ! -e noor/android/app/src/main/cpp/whisper.cpp
          git init noor/android/app/src/main/cpp/whisper.cpp
          git -C noor/android/app/src/main/cpp/whisper.cpp remote add origin https://github.com/ggml-org/whisper.cpp.git
          git -C noor/android/app/src/main/cpp/whisper.cpp fetch --depth 1 origin v1.9.4
          git -C noor/android/app/src/main/cpp/whisper.cpp checkout --detach FETCH_HEAD
          test -f noor/android/app/src/main/cpp/whisper.cpp/include/whisper.h

      - name: Enable AndroidX
        shell: bash
        run: |
          touch noor/android/gradle.properties
          echo 'android.useAndroidX=true' >> noor/android/gradle.properties
          echo 'android.enableJetifier=true' >> noor/android/gradle.properties
          grep -Fx 'android.useAndroidX=true' noor/android/gradle.properties

      - name: Prevent Ninja manifest regeneration loop
        shell: bash
        run: |
          CMAKE_FILE=noor/android/app/src/main/cpp/CMakeLists.txt
          if ! grep -q '^set(CMAKE_SUPPRESS_REGENERATION ON)' "$CMAKE_FILE"; then
            sed -i '/^project(noor_qwen LANGUAGES C CXX)$/a set(CMAKE_SUPPRESS_REGENERATION ON)' "$CMAKE_FILE"
          fi
          grep -Fx 'set(CMAKE_SUPPRESS_REGENERATION ON)' "$CMAKE_FILE"

      - name: Build debug APK
        working-directory: noor/android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare install package
        shell: bash
        run: |
          mkdir -p output
          cp noor/android/app/build/outputs/apk/debug/app-debug.apk output/Noor-debug.apk
          sha256sum output/Noor-debug.apk > output/Noor-debug.apk.sha256
          ls -lh output/

      - name: Upload Noor APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-APK
          path: |
            output/Noor-debug.apk
            output/Noor-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

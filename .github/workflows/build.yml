name: Build Noor Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, noor-51-fourteen-changes]
    paths:
      - "Noor-GitHub-Pages-Ready-44.zip-1.part-*"
      - ".github/workflows/build.yml"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "android/app/src/main/**"
      - "android/app/build.gradle"
      - "RELEASE_NOTES_51.md"

permissions:
  contents: read

concurrency:
  group: noor-android-build
  cancel-in-progress: true

jobs:
  apk:
    permissions:
      contents: write
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Noor Release 44
        shell: bash
        run: |
          set -euo pipefail
          rm -rf noor Noor-GitHub-Pages-Ready.zip
          mkdir noor
          BASE="Noor-GitHub-Pages-Ready-44.zip-1"
          PART0="${BASE}.part-00"
          PART1="${BASE}.part-01"
          test -s "$PART0" || { echo "Missing Release 44 part-00" >&2; exit 1; }
          test -s "$PART1" || { echo "Missing Release 44 part-01" >&2; exit 1; }
          echo "BUILD_SOURCE=Release 44"
          cat "$PART0" "$PART1" > Noor-GitHub-Pages-Ready.zip
          unzip -tq Noor-GitHub-Pages-Ready.zip
          unzip -q Noor-GitHub-Pages-Ready.zip -d noor
          echo "✓ Release 44 extracted successfully"

      - name: Apply manually uploaded Noor fixes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f src/Overlay.tsx ]]; then
            cp -a src/. noor/src/
            for FILE in index.html package.json package-lock.json android/app/src/main/java/com/noor/quran/MainActivity.java android/app/src/main/java/com/noor/quran/RecitationService.java android/app/src/main/AndroidManifest.xml android/app/build.gradle; do
              test -s "$FILE" || { echo "Missing fix file: $FILE" >&2; exit 1; }
              mkdir -p "noor/$(dirname "$FILE")"
              cp "$FILE" "noor/$FILE"
            done
            cp THIRD_PARTY_NOTICES.md noor/THIRD_PARTY_NOTICES.md
          fi

      - name: Download and validate Quran sources
        working-directory: noor
        shell: bash
        run: |
          chmod +x scripts/fetch-data.sh
          ./scripts/fetch-data.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: noor/package-lock.json

      - name: Verify Release 44 bundled assets
        shell: bash
        run: |
          set -euo pipefail
          find noor/public/fonts -maxdepth 1 -type f -printf '%f\n' | sort || true
          find noor/android/app/src/main/res/raw -maxdepth 1 -type f -printf '%f\n' | sort || true
          if [[ -s noor/android/app/src/main/res/raw/iqama_takbir.ogg ]]; then
            echo "✓ Found iqama_takbir.ogg"
          elif [[ -s noor/android/app/src/main/res/raw/iqama_takbir.opus ]]; then
            echo "✓ Found iqama_takbir.opus"
          elif [[ -s noor/android/app/src/main/res/raw/iqama_takbir.mp3 ]]; then
            echo "✓ Found iqama_takbir.mp3"
          else
            echo "Missing bundled iqama_takbir audio in Release 44" >&2
            exit 1
          fi

      - name: Install web dependencies
        working-directory: noor
        run: npm ci --no-audit --no-fund

      - name: Type check and build web app
        working-directory: noor
        run: npx tsc --noEmit && npm run qa:quran && npm test && npm run build

      - name: Inspect responsive interfaces in Chromium
        working-directory: noor
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/noor-preview.log 2>&1 &
          node src/qa-release51.mjs

      - name: Copy built web app into Android assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf noor/android/app/src/main/assets/www
          mkdir -p noor/android/app/src/main/assets/www
          cp -a noor/dist/. noor/android/app/src/main/assets/www/
          test -f noor/android/app/src/main/assets/www/index.html
          test -f noor/android/app/src/main/assets/www/data/quran.json
          test -f noor/android/app/src/main/assets/www/data/word_root_index.json
          test -f noor/android/app/src/main/assets/www/data/common_facts.json
          python3 - <<'PY'
          import json
          p="noor/android/app/src/main/assets/www/data/quran.json"
          d=json.load(open(p,encoding="utf-8"))
          assert len(d["surahs"]) == 114
          assert sum(len(s["ayahs"]) for s in d["surahs"]) == 6236
          print("✓ Quran JSON is physically bundled inside the APK assets")
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Enable AndroidX
        shell: bash
        run: |
          touch noor/android/gradle.properties
          grep -q '^android.useAndroidX=true$' noor/android/gradle.properties || echo 'android.useAndroidX=true' >> noor/android/gradle.properties
          grep -q '^android.enableJetifier=true$' noor/android/gradle.properties || echo 'android.enableJetifier=true' >> noor/android/gradle.properties

      - name: Build debug APK
        working-directory: noor/android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify Android repeat in background and locked screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install noor/android/app/build/outputs/apk/debug/app-debug.apk
            mkdir -p /tmp/noor-audio
            curl --fail --retry 2 -L https://everyayah.com/data/Abdurrahmaan_As-Sudais_192kbps/001001.mp3 -o /tmp/noor-audio/001001.mp3
            curl --fail --retry 2 -L https://everyayah.com/data/Abdurrahmaan_As-Sudais_192kbps/001002.mp3 -o /tmp/noor-audio/001002.mp3
            adb push /tmp/noor-audio/ /data/local/tmp/noor-audio/
            adb shell run-as com.noor.quran mkdir -p files/sudais
            adb shell run-as com.noor.quran cp /data/local/tmp/noor-audio/001001.mp3 files/sudais/001001.mp3
            adb shell run-as com.noor.quran cp /data/local/tmp/noor-audio/001002.mp3 files/sudais/001002.mp3
            cd noor && node src/qa-android51.mjs

      - name: Upload actual interface and Android QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Noor-QA-51
          path: noor/qa51/
          if-no-files-found: warn

      - name: Prepare install package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp noor/android/app/build/outputs/apk/debug/app-debug.apk output/Noor-debug.apk
          sha256sum output/Noor-debug.apk > output/Noor-debug.apk.sha256
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging output/Noor-debug.apk > output/Noor-package.txt
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs output/Noor-debug.apk > output/Noor-signature.txt
          ls -lh output/

      - name: Upload Noor APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-APK
          path: |
            output/Noor-debug.apk
            output/Noor-debug.apk.sha256
            output/Noor-package.txt
            output/Noor-signature.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Noor Release 51
    needs: apk
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release:noor-51]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Noor-APK
          path: output
      - name: Prepare versioned APK
        run: |
          mv output/Noor-debug.apk output/Noor-Release-51.apk
          rm output/Noor-debug.apk.sha256
          (cd output && sha256sum Noor-Release-51.apk > Noor-Release-51.apk.sha256)
      - name: Publish built APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          gh release create noor-release-51 output/* --target "$RELEASE_TARGET" --title "Noor Release 51 — Stories, Fiqh, Tadabbur and Background Repeat" --notes-file RELEASE_NOTES_51.md --latest

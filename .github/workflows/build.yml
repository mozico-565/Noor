name: Build Noor Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Noor-GitHub-Pages-Ready-44.zip-1.part-*"
      - ".github/workflows/build.yml"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "android/app/src/main/java/com/noor/quran/MainActivity.java"
      - "android/app/build.gradle"
      - "RELEASE_NOTES_48.md"

permissions:
  contents: read

concurrency:
  group: noor-android-build
  cancel-in-progress: true

jobs:
  apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Noor Release 44
        shell: bash
        run: |
          set -euo pipefail
          rm -rf noor Noor-GitHub-Pages-Ready.zip
          mkdir noor
          BASE="Noor-GitHub-Pages-Ready-44.zip-1"
          PART0="${BASE}.part-00"
          PART1="${BASE}.part-01"
          test -s "$PART0" || { echo "Missing Release 44 part-00" >&2; exit 1; }
          test -s "$PART1" || { echo "Missing Release 44 part-01" >&2; exit 1; }
          echo "BUILD_SOURCE=Release 44"
          cat "$PART0" "$PART1" > Noor-GitHub-Pages-Ready.zip
          unzip -tq Noor-GitHub-Pages-Ready.zip
          unzip -q Noor-GitHub-Pages-Ready.zip -d noor
          echo "✓ Release 44 extracted successfully"

      - name: Apply manually uploaded Noor fixes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f src/Overlay.tsx ]]; then
            cp -a src/. noor/src/
            for FILE in index.html package.json package-lock.json android/app/src/main/java/com/noor/quran/MainActivity.java android/app/build.gradle; do
              test -s "$FILE" || { echo "Missing fix file: $FILE" >&2; exit 1; }
              mkdir -p "noor/$(dirname "$FILE")"
              cp "$FILE" "noor/$FILE"
            done
          fi

      - name: Download and validate Quran sources
        working-directory: noor
        shell: bash
        run: |
          chmod +x scripts/fetch-data.sh
          ./scripts/fetch-data.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: noor/package-lock.json

      - name: Verify Release 44 bundled assets
        shell: bash
        run: |
          set -euo pipefail
          find noor/public/fonts -maxdepth 1 -type f -printf '%f\n' | sort || true
          find noor/android/app/src/main/res/raw -maxdepth 1 -type f -printf '%f\n' | sort || true
          if [[ -s noor/android/app/src/main/res/raw/iqama_takbir.ogg ]]; then
            echo "✓ Found iqama_takbir.ogg"
          elif [[ -s noor/android/app/src/main/res/raw/iqama_takbir.opus ]]; then
            echo "✓ Found iqama_takbir.opus"
          elif [[ -s noor/android/app/src/main/res/raw/iqama_takbir.mp3 ]]; then
            echo "✓ Found iqama_takbir.mp3"
          else
            echo "Missing bundled iqama_takbir audio in Release 44" >&2
            exit 1
          fi

      - name: Install web dependencies
        working-directory: noor
        run: npm ci --no-audit --no-fund

      - name: Run web integration tests
        working-directory: noor
        shell: bash
        run: |
          npm run qa:quran
          if npm run | grep -q 'qa:release43'; then
            npm run qa:release43
          elif npm run | grep -q 'qa:release42'; then
            npm run qa:release42
          fi
          npm test
          npx tsc --noEmit

      - name: Build web app
        working-directory: noor
        run: npm run build

      - name: Run real browser QA in both themes and phone sizes
        working-directory: noor
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/noor-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173 >/dev/null && break || sleep 1; done
          QA_OUTPUT=qa48/round1 node src/qa-release48.mjs
          QA_OUTPUT=qa48/round2 node src/qa-release48.mjs

      - name: Upload real UI QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Release-48-UI-QA
          path: noor/qa48/
          if-no-files-found: warn
          retention-days: 30

      - name: Copy built web app into Android assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf noor/android/app/src/main/assets/www
          mkdir -p noor/android/app/src/main/assets/www
          cp -a noor/dist/. noor/android/app/src/main/assets/www/
          test -f noor/android/app/src/main/assets/www/index.html
          test -f noor/android/app/src/main/assets/www/data/quran.json
          test -f noor/android/app/src/main/assets/www/data/word_root_index.json
          test -f noor/android/app/src/main/assets/www/data/common_facts.json
          python3 - <<'PY'
          import json
          p="noor/android/app/src/main/assets/www/data/quran.json"
          d=json.load(open(p,encoding="utf-8"))
          assert len(d["surahs"]) == 114
          assert sum(len(s["ayahs"]) for s in d["surahs"]) == 6236
          print("✓ Quran JSON is physically bundled inside the APK assets")
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Enable AndroidX
        shell: bash
        run: |
          touch noor/android/gradle.properties
          grep -q '^android.useAndroidX=true$' noor/android/gradle.properties || echo 'android.useAndroidX=true' >> noor/android/gradle.properties
          grep -q '^android.enableJetifier=true$' noor/android/gradle.properties || echo 'android.enableJetifier=true' >> noor/android/gradle.properties

      - name: Build debug APK
        working-directory: noor/android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Enable KVM for Android runtime test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test actual APK on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r noor/android/app/build/outputs/apk/debug/app-debug.apk
            cd noor && node src/qa-android48.mjs

      - name: Upload native Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Release-48-Android-QA
          path: noor/qa48/android/
          if-no-files-found: warn

      - name: Build unsigned release AAB
        working-directory: noor/android
        run: gradle :app:bundleRelease --stacktrace --no-daemon

      - name: Prepare install package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp noor/android/app/build/outputs/apk/debug/app-debug.apk output/Noor-debug.apk
          sha256sum output/Noor-debug.apk > output/Noor-debug.apk.sha256
          cp noor/android/app/build/outputs/bundle/release/app-release.aab output/Noor-release-unsigned.aab
          sha256sum output/Noor-release-unsigned.aab > output/Noor-release-unsigned.aab.sha256
          ls -lh output/

      - name: Upload Noor APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-APK
          path: |
            output/Noor-debug.apk
            output/Noor-debug.apk.sha256
            output/Noor-release-unsigned.aab
            output/Noor-release-unsigned.aab.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Noor Release 48
    needs: apk
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release:noor-48]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4

      - name: Download tested Android packages
        uses: actions/download-artifact@v4
        with:
          name: Noor-APK
          path: output

      - name: Download real UI evidence
        uses: actions/download-artifact@v4
        with:
          name: Noor-Release-48-UI-QA
          path: ui-qa

      - name: Download native Android evidence
        uses: actions/download-artifact@v4
        with:
          name: Noor-Release-48-Android-QA
          path: ui-qa/android

      - name: Prepare versioned release assets
        shell: bash
        run: |
          set -euo pipefail
          mv output/Noor-debug.apk output/Noor-Release-48.apk
          mv output/Noor-release-unsigned.aab output/Noor-Release-48-unsigned.aab
          rm output/Noor-debug.apk.sha256 output/Noor-release-unsigned.aab.sha256
          python3 - <<'PY_ASSETS'
          import io, pathlib, zipfile
          root = pathlib.Path('.')
          patch_files = ['.github/workflows/build.yml', 'index.html', 'package.json', 'package-lock.json', 'RELEASE_48_QA.md', 'android/app/src/main/java/com/noor/quran/MainActivity.java', 'android/app/build.gradle'] + [str(p) for p in sorted(root.glob('src/*')) if p.is_file()]
          parts = sorted(root.glob('Noor-GitHub-Pages-Ready-44.zip-1.part-*'))
          assert len(parts) == 2
          with zipfile.ZipFile(io.BytesIO(b''.join(p.read_bytes() for p in parts))) as original, zipfile.ZipFile('output/Noor-Release-48-Source.zip', 'w', zipfile.ZIP_DEFLATED) as source:
              for name in original.namelist():
                  if name.endswith('/') or name in patch_files or any(part in name.split('/') for part in ['node_modules', 'dist', 'build', '.gradle', 'cache']) or name.startswith('android/app/src/main/assets/www/'):
                      continue
                  source.writestr(name, original.read(name))
              for name in patch_files:
                  source.writestr(name, (root / name).read_bytes())
              source.writestr('RELEASE_NOTES_48.md', (root / 'RELEASE_NOTES_48.md').read_bytes())
          with zipfile.ZipFile('output/Noor-Release-48-Patch.zip', 'w', zipfile.ZIP_DEFLATED) as patch:
              for name in patch_files:
                  patch.writestr(name, (root / name).read_bytes())
          PY_ASSETS
          cp RELEASE_48_QA.md output/RELEASE_48_QA.md
          (cd ui-qa && zip -qr ../output/Noor-Release-48-QA.zip .)
          (cd output && sha256sum Noor-Release-48.apk Noor-Release-48-unsigned.aab Noor-Release-48-Source.zip Noor-Release-48-Patch.zip Noor-Release-48-QA.zip RELEASE_48_QA.md > SHA256SUMS.txt)

      - name: Publish this tested version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          gh release create noor-release-48 output/* \
            --target "$RELEASE_TARGET" \
            --title "Noor Release 48 — Revelation Journey and Restored Home Layout" \
            --notes-file RELEASE_NOTES_48.md \
            --latest
